name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobsoo
          POSTGRES_PASSWORD: jobsoo
          POSTGRES_DB: jobsoo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobsoo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://jobsoo:jobsoo@localhost:5432/jobsoo_test
      JOBSOO_TEST_DATABASE_URL: postgresql+psycopg://jobsoo:jobsoo@localhost:5432/jobsoo_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy app
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing -m "integration or not integration"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check & build
        run: npm run build
      - name: Tests
        run: npm test --if-present
