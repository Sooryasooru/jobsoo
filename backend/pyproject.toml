[project]
name = "jobsoo-backend"
version = "0.1.0"
description = "Job Application Intelligence Platform - backend (Phase 1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "jinja2>=3.1",
    "weasyprint>=63",
    "pdfminer.six>=20250327",
    "python-docx>=1.1",
    "anthropic>=0.40",
    "python-multipart>=0.0.9",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle / pyflakes
    "I",                 # isort
    "B",                 # bugbear
    "UP",                # pyupgrade
    "S",                 # bandit (security)
    "C4",                # comprehensions
    "SIM",               # simplify
    "ARG",               # unused arguments
]
ignore = [
    "E501",              # line length handled by formatter
    "B008",              # FastAPI dependency pattern uses call in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "ARG001", "ARG005"]
"alembic/versions/*.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["weasyprint.*", "pdfminer.*", "docx.*", "structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: database / API integration tests (requires PostgreSQL)",
]
filterwarnings = ["error::sqlalchemy.exc.SAWarning", "ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py"]
